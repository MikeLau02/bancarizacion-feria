<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Imprimir códigos QR · Feria QR</title>
  <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="icon" href="/favicon.svg">
</head>
<body>
  <div class="container-xl py-3">
    <div class="no-imprimir d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <div><h1 class="h4 fw-bold mb-0">Tarjetas QR para imprimir</h1><div class="text-secondary small" id="info">Cargando...</div></div>
      <div class="d-flex gap-2"><button class="btn btn-primary" onclick="window.print()"><i class="bi bi-printer"></i> Imprimir</button>
      <a class="btn btn-outline-primary" id="btnPdf" href="#"><i class="bi bi-filetype-pdf"></i> PDF (12 por página)</a>
      <button class="btn btn-outline-secondary" onclick="window.close()">Cerrar</button></div>
    </div>
    <div class="hoja-qr" id="hoja"></div>
  </div>
  <script src="/js/comun.js"></script>
  <script>
    (async () => {
      const q = new URLSearchParams(location.search);
      [...q.keys()].forEach((k) => { if (!q.get(k)) q.delete(k); });
      document.getElementById('btnPdf').href = '/api/admin/qr/pdf?' + q;
      try {
        const r = await api('/api/admin/qr/tarjetas?' + q);
        document.getElementById('info').textContent = `${r.tarjetas.length} tarjetas · recórtelas por la línea punteada`;
        document.getElementById('hoja').innerHTML = r.tarjetas.map((t) => `
          <div class="tarjeta-qr">
            <div class="feria">${esc(r.feria)}</div>
            ${t.qr /* SVG generado por el servidor */}
            <div class="nombre">${esc(t.nombre)}</div>
            <div class="curso">${t.curso ? 'Curso ' + esc(t.curso) : esc(t.rol)}</div>
            <div class="codigo">${esc(t.codigo)}</div>
          </div>`).join('');
        if (r.tarjetas.length === 1) setTimeout(() => window.print(), 400);
      } catch (e) {
        document.getElementById('info').textContent = e.message;
      }
    })();
  </script>
</body>
</html>
